<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esqueceram AI</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      window.API_URL = "%VITE_API_URL%" || "https://esqueceramai.onrender.com";
    </script>
  </head>
  <body>
    <main class="container">
      <h1>Esqueceram AI</h1>
      <p>Cadastre um item perdido ou encontrado.</p>

      <form id="item-form">
        <!-- Formulário de cadastro de item perdido -->
      </form>
      <!-- Status do item: indica se foi encontrado ou não -->
      <p id="message" role="status"></p>
      <!-- TEMPORÁRIO: Listagem de itens cadastrados -->
      <section>
        <h2>Itens cadastrados</h2>
        <ul id="items"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
