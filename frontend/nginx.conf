server {
    listen 80;

    # REGRA 1: Tudo o que começar com /api vai direto para o backend Flask
    location /api {
        proxy_pass http://backend:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REGRA 2: Rotas comuns (/, /itens, /usuarios) servem os arquivos estáticos do frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Permite URLs limpas. Se acessar /usuarios, procura usuários.html ou index.html
        try_files $uri $uri/ $uri.html /index.html;
    }
}