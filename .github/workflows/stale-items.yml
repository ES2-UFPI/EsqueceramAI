name: Verificação diária de caducidade (US08)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  stale-items-check:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_STALE_ITEMS_CRON == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar rotina diária de caducidade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL não configurada; pulando execução."
            exit 0
          fi
          python -m application.jobs.stale_items --json
