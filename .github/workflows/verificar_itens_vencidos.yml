name: Verificação diária de itens armazenados (US08)

on:
  schedule:
    # 09:00 UTC = 06:00 em Fortaleza (UTC-3, sem horário de verão)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar itens armazenados há mais de 90 dias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_RETENTION_DAYS: "90"
        run: python -m application.jobs.stale_items
