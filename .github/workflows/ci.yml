name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate YAML files
        run: python -c "import pathlib, yaml; [yaml.safe_load(path.read_text()) for path in pathlib.Path('.').rglob('*.yml')]; print('YAML válido')"
