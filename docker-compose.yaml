version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: esqueceram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:10000"
    environment:
      - PORT=10000
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:password@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    # CORREÇÃO: Força o Gunicorn local a aceitar processos longos (timeouts) e mais conexões (threads)
    command: gunicorn --bind 0.0.0.0:10000 --timeout 120 --workers 2 --threads 4 app:app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    # Mantemos o volume do frontend pois o Nginx lida muito bem com caminhos do Windows
    volumes:
      - ./frontend:/usr/share/nginx/html
      # Sobrescreve a configuração padrão do Nginx com o proxy /api para o backend
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

networks:
  default:
    name: esqueceram-network

volumes:
  postgres_data:
