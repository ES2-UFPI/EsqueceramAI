services:
  - type: web
    name: esqueceram-ai-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: FRONTEND_ORIGIN
        value: "https://es2-ufpi.github.io" # Libera o CORS para o GitHub Pages
